    <section id="new_games">
      <h3>Ge förslag på spel!</h3>
      <form id="kontakt-form">
        <label for="namn">Namn:</label>
        <input type="text" id="namn" name="namn" placeholder="Ditt namn" required>
    
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Din email" required>
    
        <label for="spel">Ditt spelförslag:</label>
        <textarea id="meddelande" name="meddelande" placeholder="Skriv ditt förslag..." required></textarea>
    
        <button type="submit">Skicka</button>
      </form>
